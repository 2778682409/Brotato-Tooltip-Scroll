name: Build Brotato Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare Mod Structure
        run: |
          # 按照 Brotato ModLoader 的标准规范建立文件夹
          mkdir -p build/mods-unpacked/yuan-TooltipScroll
          cp manifest.json mod_main.gd build/mods-unpacked/yuan-TooltipScroll/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TooltipScroll-Mod
          # 直接上传 build 文件夹里的所有内容
          path: build/
